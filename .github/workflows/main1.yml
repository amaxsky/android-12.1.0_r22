name: Build TouchInputMapper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 openjdk-11-jdk \
            bc bison build-essential ccache flex g++-multilib gcc-multilib \
            gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone and replace build.sh
        run: |
          mkdir -p pixel
          cd pixel
          git clone https://github.com/ponces/treble_build_pe -b twelve
          curl -fL "https://github.com/amaxsky/android-12.1.0_r22/raw/refs/heads/main/build.sh" \
            -o treble_build_pe/build.sh
          chmod +x treble_build_pe/build.sh

      - name: Run build.sh and stop after TouchInputMapper
        run: |
          cd pixel
          setsid bash treble_build_pe/build.sh twelve &
          BUILD_PID=$!

          PREV=""
          STABLE=0
          while kill -0 $BUILD_PID 2>/dev/null; do
            CUR=$(find out -type f \( -name 'TouchInputMapper.o' -o -name 'libinput*.so' \) \
                    -printf '%p %s\n' 2>/dev/null | sort)
            HAS_O=$(echo "$CUR" | grep -c 'TouchInputMapper.o' || true)
            HAS_SO=$(echo "$CUR" | grep -c 'libinput.*\.so' || true)

            if [ "$HAS_O" -ge 1 ] && [ "$HAS_SO" -ge 1 ]; then
              if [ "$CUR" = "$PREV" ]; then
                STABLE=$((STABLE+1))
              else
                STABLE=0
              fi
              PREV="$CUR"
              if [ "$STABLE" -ge 2 ]; then
                echo "TouchInputMapper and libinput*.so ready, stopping."
                break
              fi
            else
              STABLE=0
            fi
            sleep 10
          done

          # 杀掉进程组，避免残留 make
          kill -- -$BUILD_PID 2>/dev/null || true
          wait $BUILD_PID 2>/dev/null || true

          mkdir -p $GITHUB_WORKSPACE/artifacts
          find out -type f \( -name 'TouchInputMapper.o' -o -name 'libinput*.so' \) \
            -exec cp {} $GITHUB_WORKSPACE/artifacts/ \; 2>/dev/null || true
          ls -lR $GITHUB_WORKSPACE/artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: input-artifacts
          path: ${{ github.workspace }}/artifacts/*
          if-no-files-found: error
