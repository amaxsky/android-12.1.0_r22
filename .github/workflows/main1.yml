name: Build TouchInputMapper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 openjdk-11-jdk \
            bc bison build-essential ccache flex g++-multilib gcc-multilib \
            gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Clone build scripts
        run: |
          mkdir -p pixel
          cd pixel
          git clone https://github.com/ponces/treble_build_pe -b twelve

      - name: Write minimal build.sh
        run: |
          cat > pixel/build.sh <<'EOF'
          #!/bin/bash
          set -e
          BL=$PWD/treble_build_pe
          BRANCH=twelve

          echo "--> Init"
          repo init -u https://github.com/PixelExperience/manifest -b $BRANCH --depth=1
          mkdir -p .repo/local_manifests
          cp $BL/manifest.xml .repo/local_manifests/pixel.xml

          echo "--> Sync minimal set"
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all) \
            build/make build/soong build/blueprint \
            frameworks/native frameworks/base \
            system/core system/logging system/libbase \
            external/boringssl external/zlib external/libcxx \
            bionic \
            prebuilts/clang/host/linux-x86 \
            prebuilts/build-tools \
            prebuilts/sdk \
            vendor/aosp \
            device/phh/treble

          echo "--> Replace TouchInputMapper.cpp"
          TARGET="frameworks/native/services/inputflinger/reader/mapper/TouchInputMapper.cpp"
          URL="https://github.com/amaxsky/android-12.1.0_r22/raw/refs/heads/main/TouchInputMapper.cpp"
          echo "MD5 before: $(md5sum "$TARGET" | awk '{print $1}')"
          curl -fL "$URL" -o "$TARGET"
          echo "MD5 after:  $(md5sum "$TARGET" | awk '{print $1}')"

          echo "--> Build libinputreader"
          source build/envsetup.sh
          lunch treble_arm64_bvN-userdebug
          m -j$(nproc --all) libinputreader

          echo "--> Collect"
          mkdir -p $GITHUB_WORKSPACE/artifacts
          find out -type f \( -name 'libinputreader.so' -o -name 'TouchInputMapper.o' \) \
            -exec cp {} $GITHUB_WORKSPACE/artifacts/ \;
          ls -lR $GITHUB_WORKSPACE/artifacts
          EOF
          chmod +x pixel/build.sh

      - name: Run build.sh
        run: |
          cd pixel
          bash build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: input-artifacts
          path: ${{ github.workspace }}/artifacts/*
          if-no-files-found: error
