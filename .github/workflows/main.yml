name: Build PE GSI (TouchInputMapper)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 openjdk-11-jdk \
            bc bison build-essential ccache flex g++-multilib gcc-multilib \
            gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Clone repo and replace build.sh
        run: |
          mkdir -p pixel
          cd pixel
          git clone https://github.com/ponces/treble_build_pe -b twelve
          curl -fL "https://github.com/amaxsky/android-12.1.0_r22/raw/refs/heads/main/build.sh" \
            -o treble_build_pe/build.sh
          chmod +x treble_build_pe/build.sh

      - name: Run build.sh and capture libinput
        run: |
          cd pixel
          setsid bash treble_build_pe/build.sh twelve &
          BUILD_PID=$!

          EXPECTED_FILE=/tmp/expected_libinput.txt
          grep -rhoE 'name:\s*"libinput[^"]*"' \
            frameworks/native frameworks/base 2>/dev/null \
            | sed -E 's/name:\s*"([^"]*)"/\1/' \
            | sort -u | sed 's/$/.so/' > "$EXPECTED_FILE" || true
          echo "Expected libs:"; cat "$EXPECTED_FILE"

          if [ ! -s "$EXPECTED_FILE" ]; then
            cat > "$EXPECTED_FILE" <<'EOF'
          libinput.so
          libinputflinger.so
          libinputservice.so
          EOF
          fi

          STABLE=0
          PREV=""
          while kill -0 $BUILD_PID 2>/dev/null; do
            CUR=$(find out -type f -name 'libinput*.so' -printf '%p %s\n' 2>/dev/null | sort)
            MISSING=0
            while read -r lib; do
              [ -z "$lib" ] && continue
              if ! find out -type f -name "$lib" | grep -q .; then
                MISSING=1
                break
              fi
            done < "$EXPECTED_FILE"

            if [ "$MISSING" -eq 0 ] && [ -n "$CUR" ]; then
              if [ "$CUR" = "$PREV" ]; then
                STABLE=$((STABLE+1))
              else
                STABLE=0
              fi
              PREV="$CUR"
              if [ "$STABLE" -ge 2 ]; then
                echo "All expected libs present and stable."
                break
              fi
            else
              STABLE=0
            fi
            sleep 15
          done

          if [ "$STABLE" -lt 2 ]; then
            echo "!!! Build ended before all libinput*.so stabilized"
            wait $BUILD_PID || true
            exit 1
          fi

          kill -- -$BUILD_PID 2>/dev/null || true
          wait $BUILD_PID 2>/dev/null || true

          mkdir -p $GITHUB_WORKSPACE/artifacts/lib $GITHUB_WORKSPACE/artifacts/lib64
          find out -type f -path '*/system/lib/libinput*.so' \
            -exec cp {} $GITHUB_WORKSPACE/artifacts/lib/ \;
          find out -type f -path '*/system/lib64/libinput*.so' \
            -exec cp {} $GITHUB_WORKSPACE/artifacts/lib64/ \;

          echo "Collected:"
          ls -lR $GITHUB_WORKSPACE/artifacts

      - name: Upload libinput artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libinput-so
          path: |
            ${{ github.workspace }}/artifacts/lib/libinput*.so
            ${{ github.workspace }}/artifacts/lib64/libinput*.so
          if-no-files-found: error
